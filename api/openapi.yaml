      "ResolveCache": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "state",
          "metadata_ttl_seconds",
          "stale_if_error_seconds",
          "servable_stale_on_error"
        ],
        "properties": {
          "state": {
            "type": "string",
            "enum": [
              "not_applicable",
              "not_cached",
              "fresh",
              "stale"
            ]
          },
          "last_cached_at": {
            "type": "string",
            "format": "date-time"
          },
          "last_accessed_at": {
            "type": "string",
            "format": "date-time"
          },
          "age_seconds": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "metadata_ttl_seconds": {
            "type": "integer"
          },
          "stale_if_error_seconds": {
            "type": "integer"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "servable_stale_on_error": {
            "type": "boolean"
          }
        }
      },
      "ResolveExplanation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "feed_id",
          "coordinate",
          "namespace",
          "status",
          "sources",
          "cache",
          "hidden_sources"
        ],
        "properties": {
          "feed_id": {
            "type": "string",
            "format": "uuid"
          },
          "coordinate": {
            "type": "string"
          },
          "namespace": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "served",
              "pull_through",
              "not_found",
              "namespace_mismatch"
            ]
          },
          "serving": {
            "$ref": "#/components/schemas/ResolveSource"
          },
          "sources": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ResolveSource"
            },
            "description": "Readable attached sources in read order."
          },
          "cache": {
            "$ref": "#/components/schemas/ResolveCache"
          },
          "hidden_sources": {
            "type": "integer",
            "minimum": 0,
            "description": "Attached sources omitted because the caller cannot read them."
          }
        }
