      "RemoteSourceConfig": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "origin",
          "redirect_origins",
          "allow_private",
          "timeout_seconds",
          "cache"
        ],
        "properties": {
          "origin": {
            "type": "string",
            "maxLength": 4096,
            "pattern": "^https://",
            "description": "Trusted HTTPS base URL without credentials, query, fragments, or encoded/dot path segments."
          },
          "redirect_origins": {
            "type": "array",
            "maxItems": 16,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "maxLength": 4096
            }
          },
          "credential_id": {
            "type": "string",
            "pattern": "^$|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
            "description": "Encrypted credential record bound to this source; omit to detach. Never plaintext."
          },
          "ca_ref": {
            "type": "string",
            "pattern": "^$|^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$",
            "description": "Opaque operator-approved mounted CA identifier; no filesystem paths."
          },
          "allow_private": {
            "type": "boolean"
          },
          "timeout_seconds": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 300
          },
          "cache": {
            "$ref": "#/components/schemas/RemoteCachePolicy"
          }
        }
