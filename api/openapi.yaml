      "RemoteCredentialInput": {
        "type": "object",
        "additionalProperties": false,
        "minProperties": 1,
        "properties": {
          "authorization": {
            "type": "string",
            "maxLength": 8192,
            "writeOnly": true,
            "pattern": "^[ -~]*$"
          },
          "api_key": {
            "type": "string",
            "maxLength": 8192,
            "writeOnly": true,
