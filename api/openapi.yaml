      "TokenRecord": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "principal_id",
          "scopes",
          "status",
          "created_at",
          "expires_at"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "principal_id": {
            "type": "string",
            "format": "uuid"
          },
          "scopes": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "actions"
              ],
              "properties": {
                "feed_id": {
                  "type": "string",
                  "format": "uuid"
                },
                "namespace": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 200
                },
                "actions": {
                  "type": "array",
                  "items": {
                    "type": "string",
                    "enum": [
                      "read",
                      "publish",
                      "delete",
                      "configure",
                      "replicate",
                      "admin"
                    ]
                  },
                  "maxItems": 6,
                  "minItems": 1,
                  "uniqueItems": true
                }
              }
            }
          },
          "status": {
            "type": "string",
            "enum": [
              "active",
              "expired",
              "revoked"
            ]
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "revoked_at": {
            "type": "string",
            "format": "date-time"
          },
          "last_used_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
