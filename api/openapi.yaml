    "/api/v1/federation/audit": {
      "get": {
        "operationId": "federatedAudit",
        "description": "Federated audit query: this member's audit events and those of the other members, newest first. The query fans out over the mTLS peer listener with a signed principal assertion; each member authorizes the asserted caller itself and requires instance admin there (the grant of GET /api/v1/audit), so a member where the caller is not an administrator is reported as forbidden and partial=true. Members that time out or are unreachable are reported in members[] and never fail the query. Federated principals only (403 not_federated otherwise). Pagination uses one watermark per member inside an authenticated cursor.",
        "parameters": [
          {
            "name": "action",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 128
            }
          },
          {
            "name": "prefix",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 128
            },
            "description": "Action prefix, for example federation."
          },
          {
            "name": "result",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "success",
                "denied",
                "failure"
              ]
            }
          },
          {
            "name": "from",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "members",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Comma-separated member IDs or names; default all."
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
