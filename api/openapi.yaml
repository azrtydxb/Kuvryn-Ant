            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 300
          },
          "stale_if_error_seconds": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 86400
          },
          "max_entries": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 100000
