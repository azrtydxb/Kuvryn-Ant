        "properties": {
          "rule_id": {
            "type": "string"
          },
          "priority": {
            "type": "integer",
            "format": "int64"
          },
          "matched": {
            "type": "boolean"
          },
          "selected": {
            "type": "boolean"
          },
          "reason": {
            "type": "string"
          }
        }
      },
