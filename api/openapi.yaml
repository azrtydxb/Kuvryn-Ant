      "FederationFeedRouting": {
        "type": "object",
        "additionalProperties": false,
        "description": "Placement-aware read routing of a feed key (P2-M5). Writes are never routed (D6).",
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "proxy",
              "redirect",
              "off"
            ],
            "description": "proxy (default, D5): the entry member streams the holder's answer over the federation listener with the caller's signed assertion. redirect: 307 to the holder's public feed endpoint (the client must authenticate there). off: local answers only."
          },
          "blob_urls": {
            "type": "boolean",
            "description": "Proxy mode only: digest-addressed reads (OCI blobs and manifests by digest) get a 307 to a signed URL on the holder's public listener, valid for five minutes; the holder serves only bytes with that digest. Other paths are always proxied."
          },
          "blob_url_bind_client": {
            "type": "boolean",
            "description": "Requires blob_urls: each signed blob URL is bound to the client address the entry member saw and refused from any other address. Both members must resolve the same client address (direct clients, or trusted proxies on both)."
          },
          "cache": {
            "type": "boolean",
            "description": "Proxy mode only: entry members with a feed bound to the key keep immutable proxied responses and serve them to callers who may read the whole local feed. Digest-addressed responses are served as cached; any other cached response is revalidated with a holder (If-None-Match) on every hit, and deletes and metadata changes replicated from the home invalidate entries."
          },
          "cache_ttl_seconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2592000,
            "description": "Entry cache lifetime (default 86400); requires cache."
          },
          "max_lag_seconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 31536000,
            "description": "Replicas lagging more are skipped (0: each rule's lag budget)."
          },
          "prefer": {
            "type": "array",
            "maxItems": 8,
            "items": {
              "type": "string"
            },
            "description": "Member label keys; candidates sharing the entry member's value for an earlier key are tried first."
          }
        },
        "required": [
          "mode",
          "blob_urls",
          "cache"
        ]
      },
      "FederationRouteCandidate": {
        "type": "object",
