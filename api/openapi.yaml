        "properties": {
          "feed_id": {
            "type": "string",
            "format": "uuid"
          },
          "feed_revision": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SourceOrderItem"
            }
          }
        }
      },
      "CreateFeedBatch": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "slug",
          "format"
        ],
        "properties": {
          "slug": {
            "type": "string",
            "pattern": "^[a-z0-9][a-z0-9_-]{0,62}$"
          },
          "format": {
            "type": "string",
            "enum": [
              "apk",
              "ansible",
              "apt",
              "cocoapods",
              "composer",
              "conan",
              "conda",
              "oci",
              "git-lfs",
              "go",
              "helm",
              "huggingface",
              "maven",
              "npm",
              "nuget",
              "oci-artifacts",
              "p2",
              "pub",
              "pypi",
              "cran",
              "raw",
              "rubygems",
              "cargo",
              "swift",
              "terraform",
              "rpm"
            ]
          },
          "anonymous_read": {
            "type": "boolean",
            "default": false
          },
          "source_ids": {
            "type": "array",
            "maxItems": 64,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "description": "Same-format sources to attach, in read order."
          },
          "publish_policy": {
            "$ref": "#/components/schemas/PutPublishPolicy"
          }
        }
      },
      "FeedBatchResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "feed",
          "sources"
        ],
        "properties": {
          "feed": {
            "$ref": "#/components/schemas/Feed"
          },
          "sources": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SourceOrderItem"
            }
          },
          "publish_policy": {
            "$ref": "#/components/schemas/PublishPolicy"
          }
        }
      },
      "ResolveSource": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "source_id",
          "name",
          "kind",
          "priority",
          "role",
          "reason",
          "versions"
        ],
        "properties": {
          "source_id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "kind": {
            "type": "string",
            "enum": [
              "local",
              "remote",
              "replica"
            ]
          },
          "priority": {
            "type": "integer",
            "format": "int32"
          },
          "role": {
            "type": "string",
            "enum": [
              "serving",
              "shadowed",
              "absent",
              "pull_through_candidate"
            ]
          },
          "reason": {
            "type": "string"
          },
          "versions": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          }
