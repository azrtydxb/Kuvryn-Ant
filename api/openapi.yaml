          "principal_id": {
            "type": "string",
            "format": "uuid"
          },
          "principal_authorized": {
            "type": "boolean"
          },
          "trace": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/PublishPolicyTestTrace"
            }
          }
        }
      },
