    "/api/v1/federation/search": {
      "get": {
        "operationId": "federatedSearch",
        "description": "Cross-instance package search. This member searches its own federation-keyed feeds and fans the query out over the mTLS peer listener with a signed principal assertion; every member applies its own authorization to the asserted caller. Members that time out (1.5 s each, 2 s overall), are unreachable or refuse are reported in members[] and partial=true; they never fail the query. A digest query is the checksum lookup. Local-only principals get 403 not_federated.",
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 256
            },
            "description": "Case-insensitive literal substring of the package coordinate."
          },
          {
            "name": "format",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 32
            }
          },
          {
            "name": "namespace",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 256
            }
          },
          {
            "name": "digest",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "description": "Only packages with an asset of this blob digest."
          },
          {
            "name": "feed_key",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 200
            },
            "description": "Restrict to one federation feed key."
          },
          {
            "name": "members",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 4096
            },
            "description": "Comma-separated member IDs or names to query; default all active members."
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 2048
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response",
