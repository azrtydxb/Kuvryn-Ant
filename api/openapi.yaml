      "AuditEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "created_at",
          "action",
          "result",
          "details"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "principal_id": {
            "type": "string",
            "format": "uuid"
          },
          "action": {
            "type": "string"
          },
          "resource_id": {
            "type": "string",
            "format": "uuid"
          },
          "result": {
            "type": "string",
