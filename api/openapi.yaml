          "feed_slug": {
            "type": "string"
          },
          "format": {
            "type": "string",
            "enum": [
              "apk",
              "ansible",
              "apt",
              "cocoapods",
              "composer",
              "conan",
              "conda",
              "oci",
              "git-lfs",
              "go",
              "helm",
              "huggingface",
              "maven",
              "npm",
              "nuget",
              "oci-artifacts",
              "p2",
              "pub",
              "pypi",
              "cran",
              "raw",
              "rubygems",
              "cargo",
              "swift",
              "terraform",
              "rpm"
            ]
          },
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "coordinate": {
            "type": "string"
          },
          "namespace": {
            "type": "string"
          },
          "source_id": {
            "type": "string",
