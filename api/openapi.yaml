{
  "openapi": "3.0.3",
  "info": {
    "title": "Kuvryn Ant Management API",
    "version": "0.1.0",
    "description": "Version 1 management contract. Feed routes manage configuration only; creating a feed does not imply its format adapter is implemented. Package protocols are separate from management API versioning."
  },
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/api/v1/status": {
      "get": {
        "operationId": "getStatus",
        "security": [],
        "responses": {
          "200": {
            "description": "Successful response",
            "headers": {
              "X-Request-ID": {
                "description": "Server-generated correlation identifier",
                "schema": {
                  "type": "string",
                  "minLength": 16
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ServiceStatus"
                }
              }
            }
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "500": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/feeds": {
      "get": {
        "operationId": "listFeeds",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 50
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 2048
            }
          },
          {
            "name": "prefix",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 200
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "headers": {
              "X-Request-ID": {
                "description": "Server-generated correlation identifier",
                "schema": {
                  "type": "string",
                  "minLength": 16
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/FeedPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "429": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "500": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "post": {
        "operationId": "createFeed",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateFeed"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Successful response",
            "headers": {
              "X-Request-ID": {
                "description": "Server-generated correlation identifier",
                "schema": {
                  "type": "string",
                  "minLength": 16
                }
              },
              "ETag": {
                "description": "Quoted positive revision",
                "schema": {
                  "type": "string",
                  "pattern": "^\"[1-9][0-9]*\"$"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Feed"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "429": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "500": {
            "$ref": "#/components/responses/Error"
          },
          "413": {
            "$ref": "#/components/responses/Error"
          },
          "415": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/v1/feeds/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "get": {
        "operationId": "getFeed",
        "responses": {
          "200": {
            "description": "Successful response",
            "headers": {
              "X-Request-ID": {
                "description": "Server-generated correlation identifier",
                "schema": {
                  "type": "string",
                  "minLength": 16
                }
              },
              "ETag": {
                "description": "Quoted positive revision",
                "schema": {
                  "type": "string",
                  "pattern": "^\"[1-9][0-9]*\"$"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Feed"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          },
          "429": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "500": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "patch": {
        "operationId": "updateFeed",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 256
            }
          },
          {
            "name": "If-Match",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^\"[1-9][0-9]*\"$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PatchFeed"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful response",
            "headers": {
              "X-Request-ID": {
                "description": "Server-generated correlation identifier",
                "schema": {
                  "type": "string",
                  "minLength": 16
                }
              },
              "ETag": {
                "description": "Quoted positive revision",
                "schema": {
                  "type": "string",
                  "pattern": "^\"[1-9][0-9]*\"$"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Feed"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "429": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          },
          "412": {
            "$ref": "#/components/responses/Error"
          },
          "428": {
            "$ref": "#/components/responses/Error"
          },
          "500": {
            "$ref": "#/components/responses/Error"
          },
          "413": {
            "$ref": "#/components/responses/Error"
          },
          "415": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "responses": {
      "Error": {
        "description": "Stable sanitized error",
        "headers": {
          "X-Request-ID": {
            "description": "Server-generated correlation identifier",
            "schema": {
              "type": "string",
              "minLength": 16
            }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    },
    "schemas": {
      "ServiceStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "api_version"
        ],
        "properties": {
          "name": {
            "type": "string",
            "enum": [
              "kuvryn-ant"
            ]
          },
          "api_version": {
            "type": "string",
            "enum": [
              "v1"
            ]
          }
        }
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "request_id"
        ],
        "properties": {
          "code": {
            "type": "string",
            "enum": [
              "invalid_request",
              "unauthenticated",
              "forbidden",
              "not_found",
              "conflict",
              "precondition_failed",
              "unavailable",
              "internal_error"
            ],
            "x-enum-varnames": [
              "ErrorCodeInvalidRequest",
              "ErrorCodeUnauthenticated",
              "ErrorCodeForbidden",
              "ErrorCodeNotFound",
              "ErrorCodeConflict",
              "ErrorCodePreconditionFailed",
              "ErrorCodeUnavailable",
              "ErrorCodeInternalError"
            ]
          },
          "message": {
            "type": "string"
          },
          "request_id": {
            "type": "string",
            "minLength": 16
          }
        }
      },
      "PageInfo": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "has_more"
        ],
        "properties": {
          "has_more": {
            "type": "boolean"
          },
          "next_cursor": {
            "type": "string",
            "maxLength": 2048
          }
        }
      },
      "Feed": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "slug",
          "format",
          "revision",
          "anonymous_read"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "slug": {
            "type": "string",
            "pattern": "^[a-z0-9][a-z0-9_-]{0,62}$"
          },
          "format": {
            "type": "string",
            "enum": [
              "apk",
              "ansible",
              "apt",
              "cocoapods",
              "composer",
              "conan",
              "conda",
              "oci",
              "git-lfs",
              "go",
              "helm",
              "huggingface",
              "maven",
              "npm",
              "nuget",
              "oci-artifacts",
              "p2",
              "pub",
              "pypi",
              "cran",
              "raw",
              "rubygems",
              "cargo",
              "swift",
              "terraform",
              "rpm"
            ]
          },
          "revision": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "anonymous_read": {
            "type": "boolean",
            "default": false
          }
        }
      },
      "CreateFeed": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "slug",
          "format"
        ],
        "properties": {
          "slug": {
            "type": "string",
            "pattern": "^[a-z0-9][a-z0-9_-]{0,62}$"
          },
          "format": {
            "type": "string",
            "enum": [
              "apk",
              "ansible",
              "apt",
              "cocoapods",
              "composer",
              "conan",
              "conda",
              "oci",
              "git-lfs",
              "go",
              "helm",
              "huggingface",
              "maven",
              "npm",
              "nuget",
              "oci-artifacts",
              "p2",
              "pub",
              "pypi",
              "cran",
              "raw",
              "rubygems",
              "cargo",
              "swift",
              "terraform",
              "rpm"
            ]
          },
          "anonymous_read": {
            "type": "boolean",
            "default": false
          }
        }
      },
      "PatchFeed": {
        "type": "object",
        "additionalProperties": false,
        "minProperties": 1,
        "properties": {
          "slug": {
            "type": "string",
            "pattern": "^[a-z0-9][a-z0-9_-]{0,62}$"
          },
          "anonymous_read": {
            "type": "boolean",
            "default": false
          }
        }
      },
      "FeedPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "page"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Feed"
            }
          },
          "page": {
            "$ref": "#/components/schemas/PageInfo"
          }
        }
      }
    }
  }
}
