{
  "openapi": "3.0.3",
  "info": {
    "title": "Kuvryn Ant federation peer protocol",
    "version": "1",
    "description": "Member-to-member protocol served on the dedicated federation listener (ANT_FEDERATION_LISTEN, TLS 1.3 with mutual authentication), never on the public HTTP listener. Protocol version 1 (membership protocol.min/max). The management API for administrators is api/openapi.yaml.\n\nAuthentication of every route except the two join routes: the client certificate must be issued by a federation CA of the applied membership and pinned by fingerprint in the membership (cert_sha256, or previous_cert_sha256 during the 24 h renewal grace), and its serial must not be revoked; the request carries X-Ant-Fed-Member (instance ID), X-Ant-Fed-Timestamp (RFC 3339, at most 60 s skew), X-Ant-Fed-Nonce (single use for 5 minutes per member) and X-Ant-Fed-Signature, an Ed25519 signature with the member's membership signing key over the lines `kuvryn-ant-federation-v1`, method, path and query, member, timestamp, nonce and the hex SHA-256 of the body. Requests that act for a user additionally carry X-Ant-Fed-Assertion: a signed, 60-second, request-bound principal assertion issued by the entry member; the receiving member authorizes the asserted principal with its own policy. Request bodies are limited to 8 MiB; routes are rate limited per calling member (429 rate_limited). Errors are {\"code\": \"<stable code>\"}."
  },
  "servers": [
    {
      "url": "https://{member}:{port}",
      "variables": {
        "member": {
          "default": "ant-federation.example"
        },
        "port": {
          "default": "8444"
        }
      }
    }
  ],
  "components": {
    "securitySchemes": {
      "memberSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Ant-Fed-Signature",
        "description": "Ed25519 request signature; see info.description (also X-Ant-Fed-Member, -Timestamp, -Nonce)."
      },
      "principalAssertion": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Ant-Fed-Assertion",
        "description": "Signed, 60 s, request-bound assertion of the acting federated principal."
      }
    },
    "responses": {
      "Error": {
        "description": "Stable error code",
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "properties": {
                "code": {
                  "type": "string"
                }
              },
              "required": [
                "code"
              ]
            }
          }
        }
      }
    }
  },
