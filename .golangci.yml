# golangci-lint v2 configuration.
#
# Parallel agents and editors often run golangci-lint at the same time. By
# default golangci-lint refuses to start while another instance holds its
# cache lock, which makes the lint gate fail for reasons unrelated to the code.
# Allowing parallel and serial runners lets each run proceed independently.
version: "2"

run:
  allow-parallel-runners: true
  allow-serial-runners: true
  timeout: 10m
