name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ant
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ant -d ant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - name: Unit and PostgreSQL integration tests
        env:
          ANT_TEST_DATABASE_URL: postgres://ant:ci-only-password@localhost:5432/ant_test?sslmode=disable
          ANT_REQUIRE_INTEGRATION: '1'
        run: go test -race -count=1 ./...
      - run: go build ./cmd/ant
