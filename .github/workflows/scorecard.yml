name: Scorecard

# OpenSSF Scorecard supply-chain analysis. Results are uploaded to code scanning
# and published to the OpenSSF API for the README badge (public repositories).
on:
  branch_protection_rule:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # The GITHUB_TOKEN cannot read the GraphQL data Scorecard needs on a private
    # repository, so the job runs only for public repositories (push, branch
    # protection and manual runs carry the repository visibility).
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing (for the badge) and code scanning need a public repository.
          publish_results: ${{ !github.event.repository.private }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
