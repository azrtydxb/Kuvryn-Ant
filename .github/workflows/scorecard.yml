name: Scorecard

# OpenSSF Scorecard supply-chain analysis. Results are uploaded to code scanning
# and published to the OpenSSF API for the README badge (public repositories).
on:
  branch_protection_rule:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # The GITHUB_TOKEN cannot read the GraphQL data Scorecard needs on a private
    # repository, so the job runs only for public repositories (push, branch
    # protection and manual runs carry the repository visibility).
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing (for the badge) and code scanning need a public repository.
          publish_results: ${{ !github.event.repository.private }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
