name: Scorecard

# OpenSSF Scorecard supply-chain analysis. Results are uploaded to code scanning
# and published to the OpenSSF API for the README badge (public repositories).
on:
  branch_protection_rule:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # The GITHUB_TOKEN cannot read the GraphQL data Scorecard needs on a private
    # repository, so the job runs only for public repositories (push, branch
    # protection and manual runs carry the repository visibility).
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing (for the badge) and code scanning need a public repository.
          publish_results: ${{ !github.event.repository.private }}
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
