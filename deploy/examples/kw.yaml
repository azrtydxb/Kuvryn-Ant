# Kuvryn Ant on kw: ingress-nginx, TrueNAS SCALE MinIO. No secrets here.
publicURL: https://ant.kw.watteel.lab
image:
  repository: 192.168.10.131/azrtydxb/kuvryn-ant
  tag: "0.1.0"
imagePullSecrets:
  - name: nexus-pull
persistence:
  size: 120Gi
  storageClass: longhorn
storage:
  backend: s3
  s3:
    endpoint: http://192.168.10.253:9000 # TrueNAS MinIO (plaintext, trusted LAN only)
    region: us-east-1
    bucket: kuvryn-ant
    prefix: ant/
    pathStyle: true
    credentialsExistingSecret: ant-s3
    allowInsecureHTTP: true
postgres:
  existingSecret: ant-postgres
  tlsExistingSecret: ant-pg-rootcert
rootKey:
  existingSecret: ant-root-key
ingress:
  enabled: true
  className: nginx
  host: ant.kw.watteel.lab
  tlsSecret: ant-ingress-tls
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
extraEnv:
  ANT_OCI_DEFAULT_FEED: dockerhub
  ANT_OCI_MIRROR_MAP: docker.io=dockerhub,ghcr.io=ghcr,quay.io=quay,registry.k8s.io=k8s,gcr.io=gcr,public.ecr.aws=ecr

# Phase 2 federation (docs/operations/federation.md). kw joins the OKE
# authority over a NodePort/MetalLB Service; the invitation Secret holds
# authority_url, ca_sha256 and invitation.
# federation:
#   enabled: true
#   publicURL: https://fed.kw.example:30844
#   service:
#     type: NodePort
#     nodePort: 30844
#   join:
#     existingSecret: ant-federation-join
trustedProxies:
  - 10.42.0.0/16 # k3s pod network (ingress-nginx pods)
