# Kuvryn Ant on azrty-oke: Gateway API HTTPRoute on Gateway edge, OCI Object Storage (S3 compat).
# No secrets here; all credentials are referenced by existing Secret name.
# Replace <namespace> with the OCI Object Storage namespace.
publicURL: https://ant.azrty.com
image:
  repository: dxb.ocir.io/axmcgpqk0w0z/azrty/kuvryn-ant
  tag: "0.1.0"
imagePullSecrets:
  - name: ocir-pull
persistence:
  size: 120Gi
  storageClass: oci-bv
# The `data` volume is ~71GiB of local application state whose authoritative
# objects live in the OCI Object Storage bucket below. Measured 2026-10-19: a full
# upload of it takes ~86min at ~14MiB/s over the WireGuard link, longer than
# Velero's hourly interval, while an incremental is ~8s. When the pod rolls
# mid-upload the PodVolumeBackup is cancelled, so the next attempt repeats the
# full upload and (pkg/podvolume/backupper.go) the cancellation stalls the whole
# backup until the fs-backup timeout. Excluded 2026-10-19: no backup claims to
# cover it, and the S3 bucket above is the durable copy.
podAnnotations:
  backup.velero.io/backup-volumes-excludes: data
storage:
  backend: s3
  s3:
    endpoint: https://axmcgpqk0w0z.compat.objectstorage.me-dubai-1.oraclecloud.com
    region: me-dubai-1
    bucket: kuvryn-ant
    prefix: ant/
    pathStyle: true
    credentialsExistingSecret: ant-s3
postgres:
  existingSecret: ant-postgres
  tlsExistingSecret: ant-pg-rootcert
rootKey:
  existingSecret: ant-root-key
httpRoute:
  enabled: true
  parentRefs:
    - name: edge
      namespace: envoy-gateway-system
      sectionName: ant-https
  hostnames: [ant.azrty.com]
  timeouts:
    request: "0s"
    backendRequest: "0s"
extraEnv:
  ANT_OCI_DEFAULT_FEED: dockerhub
  ANT_OCI_MIRROR_MAP: docker.io=dockerhub,ghcr.io=ghcr,quay.io=quay,registry.k8s.io=k8s,gcr.io=gcr,public.ecr.aws=ecr

# Phase 2 federation (docs/operations/federation.md). Uncomment on the
# intended authority; members use the same block plus federation.join.
# federation:
#   enabled: true
#   publicURL: https://fed.ant.example:8444
#   service:
#     type: LoadBalancer
#     loadBalancerSourceRanges: [] # restrict to the other members
# Concurrency (see values.yaml). The shared OKE instance served 503s under load with
# 16 database connections and 4 upload slots per format; connections and slots
# are sized for the 4 CPU limit, and the S3 uploads overlap part transfer with
# the client stream. Keep dbMaxConns below the PostgreSQL max_connections.
resources:
  requests:
    cpu: "2"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi
maxRequests: 256
dbMaxConns: 48
uploadSlots: 12
trustedProxies:
  - 10.244.0.0/16 # OKE pod network (Envoy Gateway proxies)
# kw's federation endpoint (https://ant-federation.kw.watteel.lab:8444) is a LAN
# name that OKE cannot resolve. OKE initiates traffic to kw (status pings,
# nudges, search and proxied reads from OKE, pulling a feed whose home moved to
# kw), so give the pod the address of kw's federation Service
# (deploy/examples/kw-federation-lan.yaml).
hostAliases:
  - ip: 192.168.10.150
    hostnames: [ant-federation.kw.watteel.lab]
