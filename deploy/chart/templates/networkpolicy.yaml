{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ant.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "ant.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- $fed := and .Values.federation.enabled .Values.federation.networkPolicyFrom }}
  {{- if or .Values.networkPolicy.ingressFrom $fed }}
  ingress:
    {{- if .Values.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if $fed }}
    - from:
        {{- toYaml .Values.federation.networkPolicyFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.federation.port }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
