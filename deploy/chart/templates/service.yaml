apiVersion: v1
kind: Service
metadata:
  name: {{ include "ant.name" . }}
  labels:
    {{- include "ant.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ant.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.metrics.headlessService }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ant.name" . | trunc 55 | trimSuffix "-" }}-metrics
  labels:
    {{- include "ant.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ant.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
