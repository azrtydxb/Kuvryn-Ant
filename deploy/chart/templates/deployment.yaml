{{- include "ant.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ant.name" . }}
  labels:
    {{- include "ant.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ant.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ant.selector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ant
          image: {{ include "ant.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.federation.enabled }}
            - name: federation
              containerPort: {{ .Values.federation.port }}
            {{- end }}
          env:
            - name: ANT_LISTEN
              value: "0.0.0.0:8080"
            - name: ANT_DATA_DIR
              value: /var/lib/ant/data
            - name: TMPDIR
              value: {{ .Values.stagingDir | quote }}
            - name: ANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.existingSecret required" .Values.postgres.existingSecret | quote }}
                  key: {{ .Values.postgres.dsnKey | quote }}
            - name: ANT_ROOT_KEY_FILE
              value: {{ printf "/run/ant/root/%s" .Values.rootKey.key | quote }}
            - name: ANT_ROOT_KEY_VERSION
              value: {{ .Values.rootKey.activeVersion | quote }}
            {{- if .Values.rootKey.previousKeysManifestKey }}
            - name: ANT_PREVIOUS_ROOT_KEYS_FILE
              value: {{ printf "/run/ant/root/%s" .Values.rootKey.previousKeysManifestKey | quote }}
            {{- end }}
            - name: ANT_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            - name: ANT_INSTANCE_ID
              value: {{ .Values.instanceID | quote }}
            - name: ANT_SHUTDOWN_TIMEOUT
              value: {{ printf "%ds" (int .Values.shutdownSeconds) | quote }}
            {{- if .Values.maxRequests }}
            - name: ANT_MAX_REQUESTS
              value: {{ .Values.maxRequests | quote }}
            {{- end }}
            {{- if .Values.dbMaxConns }}
            - name: ANT_DB_MAX_CONNS
              value: {{ .Values.dbMaxConns | quote }}
            {{- end }}
            {{- if .Values.uploadSlots }}
            - name: ANT_UPLOAD_SLOTS
              value: {{ .Values.uploadSlots | quote }}
            {{- end }}
            - name: ANT_STORAGE_BACKEND
              value: {{ .Values.storage.backend | quote }}
            {{- if eq .Values.storage.backend "s3" }}
            - name: ANT_S3_ENDPOINT
              value: {{ .Values.storage.s3.endpoint | quote }}
            - name: ANT_S3_REGION
              value: {{ .Values.storage.s3.region | quote }}
            - name: ANT_S3_BUCKET
              value: {{ .Values.storage.s3.bucket | quote }}
            - name: ANT_S3_PREFIX
              value: {{ .Values.storage.s3.prefix | quote }}
            - name: ANT_S3_PATH_STYLE
              value: {{ .Values.storage.s3.pathStyle | quote }}
            {{- if .Values.storage.s3.allowInsecureHTTP }}
            - name: ANT_S3_ALLOW_INSECURE_HTTP
              value: "true"
            {{- end }}
            - name: ANT_S3_CREDENTIALS_FILE
              value: /run/ant/s3/credentials.json
            {{- if .Values.storage.s3.caExistingSecret }}
            - name: ANT_S3_CA_FILE
              value: /run/ant/s3-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- /* tolerate `helm upgrade --reuse-values` from releases that predate observability.tracing */}}
            {{- $obs := default dict .Values.observability }}
            {{- $tr := default dict $obs.tracing }}
            {{- if $tr.enabled }}
            - name: ANT_OTEL_ENABLED
              value: "true"
            {{- if $tr.endpoint }}
            - name: ANT_OTEL_ENDPOINT
              value: {{ $tr.endpoint | quote }}
            {{- end }}
            - name: ANT_OTEL_PROTOCOL
              value: {{ default "http/protobuf" $tr.protocol | quote }}
            - name: ANT_OTEL_SERVICE_NAME
              value: {{ default "kuvryn-ant" $tr.serviceName | quote }}
            - name: ANT_OTEL_SAMPLE_RATIO
              value: {{ default 1 $tr.sampleRatio | quote }}
            {{- end }}
            {{- if .Values.federation.enabled }}
            - name: ANT_FEDERATION_LISTEN
              value: {{ printf "0.0.0.0:%d" (int .Values.federation.port) | quote }}
            - name: ANT_FEDERATION_PUBLIC_URL
              value: {{ .Values.federation.publicURL | quote }}
            {{- with .Values.federation.routing }}
            {{- range $k, $v := dict "ANT_FEDERATION_ROUTE_MAX_STREAMS" .maxStreams "ANT_FEDERATION_ROUTE_STREAMS_PER_PRINCIPAL" .streamsPerPrincipal "ANT_FEDERATION_ROUTE_STREAMS_PER_CLIENT" .streamsPerClient "ANT_FEDERATION_ROUTE_PRINCIPAL_RATE" .principalRate "ANT_FEDERATION_ROUTE_MIN_TRANSFER_RATE" .minTransferRate "ANT_FEDERATION_ROUTE_TRANSFER_GRACE" .transferGrace "ANT_FEDERATION_ROUTE_TRANSFER_TIMEOUT" .transferTimeout }}
            {{- if $v }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.federation.join.existingSecret }}
            - name: ANT_FEDERATION_JOIN_DIR
              value: /run/ant/federation-join
            {{- end }}
            {{- end }}
            {{- if .Values.trustedProxies }}
            - name: ANT_TRUSTED_PROXIES
              value: {{ join "," .Values.trustedProxies | quote }}
            {{- end }}
            - name: ANT_AUDIT_RETENTION
              value: {{ .Values.auditRetention.retain | quote }}
            - name: ANT_AUDIT_PURGE_INTERVAL
              value: {{ .Values.auditRetention.purgeInterval | quote }}
            {{- with .Values.maintenance }}
            - name: ANT_GC_INTERVAL
              value: {{ .gcInterval | quote }}
            - name: ANT_GC_GRACE
              value: {{ .gcGrace | quote }}
            {{- if .pressure.enabled }}
            - name: ANT_PRESSURE_ENABLED
              value: "true"
            - name: ANT_PRESSURE_HIGH_PERCENT
              value: {{ .pressure.highPercent | quote }}
            - name: ANT_PRESSURE_LOW_PERCENT
              value: {{ .pressure.lowPercent | quote }}
            {{- if .pressure.capacity }}
            - name: ANT_STORAGE_CAPACITY_BYTES
              value: {{ .pressure.capacity | quote }}
            {{- end }}
            {{- end }}
            - name: ANT_PRESSURE_INTERVAL
              value: {{ .pressure.interval | quote }}
            - name: ANT_PRESSURE_SWEEP_GRACE
              value: {{ .pressure.sweepGrace | quote }}
            {{- if .defaultPolicy.maxIdle }}
            - name: ANT_RETENTION_DEFAULT_MAX_IDLE
              value: {{ .defaultPolicy.maxIdle | quote }}
            {{- end }}
            {{- if .defaultPolicy.maxAge }}
            - name: ANT_RETENTION_DEFAULT_MAX_AGE
              value: {{ .defaultPolicy.maxAge | quote }}
            {{- end }}
            {{- end }}
            {{- range $name, $value := .Values.extraEnv }}
            {{- if not (hasPrefix "ANT_" $name) }}{{ fail "extraEnv names must start with ANT_" }}{{ end }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $name, $provider := .Values.auth }}
            {{- if $provider.existingSecret }}
            - name: {{ printf "ANT_%s_CONFIG_FILE" (upper $name) }}
              value: {{ printf "/run/ant/%s/%s" $name $provider.configKey | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/ant
            - name: tmp
              mountPath: /tmp
            - name: root-key
              mountPath: /run/ant/root
              readOnly: true
            {{- if .Values.postgres.tlsExistingSecret }}
            - name: postgres-tls
              mountPath: /run/ant/postgres
              readOnly: true
            {{- end }}
            {{- if eq .Values.storage.backend "s3" }}
            - name: s3-credentials
              mountPath: /run/ant/s3
              readOnly: true
            {{- if .Values.storage.s3.caExistingSecret }}
            - name: s3-ca
              mountPath: /run/ant/s3-ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if and .Values.federation.enabled .Values.federation.join.existingSecret }}
            - name: federation-join
              mountPath: /run/ant/federation-join
              readOnly: true
            {{- end }}
            {{- range $name, $provider := .Values.auth }}
            {{- if $provider.existingSecret }}
            - name: {{ $name }}
              mountPath: {{ printf "/run/ant/%s" $name }}
              readOnly: true
            {{- end }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "ant.name" .) .Values.persistence.existingClaim | quote }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit | quote }}
        - name: root-key
          secret:
            secretName: {{ required "rootKey.existingSecret required" .Values.rootKey.existingSecret | quote }}
            defaultMode: 0440
        {{- if .Values.postgres.tlsExistingSecret }}
        - name: postgres-tls
          secret:
            secretName: {{ .Values.postgres.tlsExistingSecret | quote }}
            defaultMode: 0440
        {{- end }}
        {{- if eq .Values.storage.backend "s3" }}
        - name: s3-credentials
          secret:
            secretName: {{ .Values.storage.s3.credentialsExistingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.storage.s3.credentialsKey | quote }}
                path: credentials.json
        {{- if .Values.storage.s3.caExistingSecret }}
        - name: s3-ca
          secret:
            secretName: {{ .Values.storage.s3.caExistingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.storage.s3.caKey | quote }}
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- if and .Values.federation.enabled .Values.federation.join.existingSecret }}
        - name: federation-join
          secret:
            secretName: {{ .Values.federation.join.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: authority_url
                path: authority_url
              - key: ca_sha256
                path: ca_sha256
              - key: invitation
                path: invitation
        {{- end }}
        {{- range $name, $provider := .Values.auth }}
        {{- if $provider.existingSecret }}
        - name: {{ $name }}
          secret:
            secretName: {{ $provider.existingSecret | quote }}
            defaultMode: 0440
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
