# OKE is the primary validation target; resources are provider-neutral.
image:
  repository: kuvryn-ant
  tag: "0.1.0"
  digest: "" # Prefer an immutable sha256 digest for deployment.
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Static name-to-address entries for the pod (/etc/hosts), for example the
# federation endpoint of a member whose name only its own site resolves:
# - ip: 192.168.10.150
#   hostnames: [ant-federation.kw.watteel.lab]
hostAliases: []
# Annotations for the pod template, for example a backup tool opting a volume out
# (azrty-oke sets `backup.velero.io/backup-volumes-excludes: data`).
podAnnotations: {}
replicaCount: 1 # This release enforces exactly one writer.
publicURL: https://ant.example.invalid
instanceID: "" # Empty resolves the bootstrapped instance from PostgreSQL.
shutdownSeconds: 15
terminationGracePeriodSeconds: 45
# Upload staging (os.CreateTemp) goes here, on the data volume, not the small /tmp emptyDir.
stagingDir: /var/lib/ant/tmp
tmp:
  sizeLimit: 256Mi # Scratch only; large writes use stagingDir.
# Concurrency limits. 0 scales with the CPUs available to the pod:
# maxRequests 32 per CPU (128 to 1024), dbMaxConns 8 per CPU (16 to 64),
# uploadSlots 2 per CPU per package format (4 to 32). Keep dbMaxConns below the
# PostgreSQL max_connections.
maxRequests: 0
dbMaxConns: 0
uploadSlots: 0
postgres:
  existingSecret: ant-postgres
  dsnKey: dsn
  # Optional libpq TLS files, e.g. sslrootcert=/run/ant/postgres/ca.crt in DSN.
  tlsExistingSecret: ""
rootKey:
  existingSecret: ant-root-key
  key: root.key # Exactly 32 raw bytes; preserve and back up across upgrades.
  activeVersion: v1
  previousKeysManifestKey: "" # Optional JSON version -> mounted key filename map.
persistence:
  existingClaim: ""
  storageClass: "" # Empty uses the cluster default; select an OKE block CSI class.
  size: 120Gi
  accessModes: [ReadWriteOnce]
  annotations: {}
storage:
  backend: disk
  s3:
    endpoint: "" # Empty uses standard AWS S3 endpoint resolution.
    region: ""
    bucket: ""
    prefix: "ant/"
    pathStyle: false
    allowInsecureHTTP: false # Opt in to a plaintext http:// endpoint (trusted LAN only).
    credentialsExistingSecret: ""
    credentialsKey: credentials.json
    caExistingSecret: ""
    caKey: ca.crt
# Each provider mounts the entire Secret, including config.json and referenced
# key/certificate/password files. Config paths must use the matching mount root.
auth:
  oidc:
    existingSecret: ""
    configKey: config.json
  saml:
    existingSecret: ""
    configKey: config.json
  ldap:
    existingSecret: ""
    configKey: config.json
# Additional plain (non-secret) environment variables, e.g. ANT_OCI_DEFAULT_FEED,
# ANT_OCI_MIRROR_MAP or ANT_GC_* settings. Names must start with ANT_.
extraEnv: {}
# OpenTelemetry tracing (off by default). The endpoint is a plain URL, never a
# credential: put OTLP auth headers in a Secret and reference them through a
# platform mechanism, not here. See docs/operations/observability.md.
observability:
  tracing:
    enabled: false
    endpoint: "" # e.g. http://otel-collector.observability:4318 (http/protobuf) or :4317 (grpc)
    protocol: http/protobuf # http/protobuf | grpc
    serviceName: kuvryn-ant
    sampleRatio: 1 # 0 < ratio <= 1, parent-based
# audit_events retention. Events a configured audit sink has not exported yet
# are never purged. "0" keeps events forever.
auditRetention:
  retain: 9600h # 400 days
  purgeInterval: 1h
# Reverse proxies (ingress controller / gateway pod CIDRs) whose X-Forwarded-For
# and X-Real-IP are believed, so auth throttling and per-site limits see the
# real client instead of the shared proxy address. Empty = trust no headers.
trustedProxies: []
service:
  port: 8080
ingress:
  enabled: false
  className: ""
  host: ant.example.invalid
  tlsSecret: ""
  annotations: {} # Configure controller upload/time limits explicitly.
httpRoute: # Gateway API alternative to ingress; TLS is terminated by the Gateway.
  enabled: false
  annotations: {}
  parentRefs: [] # e.g. [{name: edge, namespace: envoy-gateway-system, sectionName: ant-https}]
  hostnames: [] # Must include the host of publicURL.
  filters: []
  # Large uploads: "0s" disables the timeout on implementations that support it.
  timeouts: {}
# Phase 2 federation (off by default). Peer traffic uses a dedicated mTLS
# listener with its own Service (decision D1): TLS must reach the pod
# unterminated, so use a LoadBalancer/NodePort Service or ingress-nginx
# ssl-passthrough. Federation keys are stored encrypted in PostgreSQL under the
# root key; the chart never handles federation key material.
federation:
  enabled: false
  port: 8444
  publicURL: "" # https URL other members use, e.g. https://fed.ant.example:8444
  service:
    type: LoadBalancer # LoadBalancer | NodePort | ClusterIP
    port: 8444
    nodePort: null
    annotations: {}
    loadBalancerSourceRanges: []
  tlsRoute: # Gateway API TLSRoute (TLS Passthrough listener on a shared gateway)
    enabled: false
    hostname: ""
    parentRefs: []
  ingressPassthrough: # ingress-nginx with --enable-ssl-passthrough
    enabled: false
    className: nginx
    host: ""
    annotations: {}
  # Optional Secret with keys authority_url, ca_sha256 and invitation. When set
  # and this instance was never federated, it joins automatically at startup.
  join:
    existingSecret: ""
  # NetworkPolicy peers allowed to reach the federation port (other members).
  networkPolicyFrom: []
metrics:
  headlessService: false # Same port; restrict scrape access with NetworkPolicy.
networkPolicy:
  enabled: false
  # Explicit peer selectors/IP blocks; [] denies all ingress when enabled.
  ingressFrom: []
  # Explicit egress rules for DNS, PostgreSQL, object storage and configured IdPs.
  # [] denies all egress. No provider-specific destination is implicitly trusted.
  egress: []
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi
nodeSelector: {}
tolerations: []
affinity: {}
