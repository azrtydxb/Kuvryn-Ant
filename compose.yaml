# Local development only; production topology is defined separately in planning.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ant
      POSTGRES_DB: ant
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ['127.0.0.1:15432:5432']
    volumes: ['postgres_data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ant -d ant']
      interval: 5s
      timeout: 5s
      retries: 10
secrets:
  postgres_password:
    file: .local/postgres-password
volumes:
  postgres_data:
